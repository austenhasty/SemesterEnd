<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>

    <style>
        body {
            font-family: Arial;
            display: flex;
            justify-content: center;
            margin-top: 40px;
            background: #f4f4f4;
        }

        .container {
            width: 420px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input, select, button {
            width: 95%;
            padding: 8px;
            margin: 5px 0;
        }

        .task {
            border: 1px solid #ddd;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
        }

        .high { color: red; }
        .medium { color: blue; }
        .low { color: green; }
    </style>
</head>

<body>

<div class="container">

    <h1>Task Manager</h1>

    <input type="text" id="taskInput" placeholder="Enter task name">

    <select id="priority">
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
    </select>

    <button id="addTaskBtn">Add Task</button>

    <div id="taskmanager"></div>

</div>

<script src="script.js"></script>

</body>
</html>
